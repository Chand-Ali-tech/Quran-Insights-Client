<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#041b1f" />
    </linearGradient>

    <!-- Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Emerald Glow Gradient -->
    <radialGradient id="emeraldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="100" height="100" rx="24" fill="url(#bgGrad)" />
  <rect width="98" height="98" x="1" y="1" rx="23" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.5" fill="none" />

  <!-- Center Ambient Radial Glow -->
  <circle cx="50" cy="50" r="38" fill="url(#emeraldGlow)" />

  <!-- 8-Pointed Star (Rub el Hizb Geometry) -->
  <g transform="translate(50, 50)">
    <!-- Square 1 (0 deg) -->
    <rect x="-24" y="-24" width="48" height="48" rx="4" fill="#042f2e" stroke="url(#goldGrad)" stroke-width="2" stroke-linejoin="round" />
    <!-- Square 2 (45 deg) -->
    <rect x="-24" y="-24" width="48" height="48" rx="4" transform="rotate(45)" fill="#042f2e" stroke="url(#goldGrad)" stroke-width="2" stroke-linejoin="round" />

    <!-- Inner Decorative Ring -->
    <circle cx="0" cy="0" r="16" fill="#022c22" stroke="url(#goldGrad)" stroke-width="1.2" stroke-opacity="0.7" />
    
    <!-- Open Book / Quran Insight Noor Motif -->
    <!-- Left Page -->
    <path d="M-1.5 6 C-7 3, -11 0, -11 -6 C-7 -4, -3 -4, -1.5 -3 Z" fill="url(#goldGrad)" />
    <!-- Right Page -->
    <path d="M1.5 6 C7 3, 11 0, 11 -6 C7 -4, 3 -4, 1.5 -3 Z" fill="url(#goldGrad)" />
    
    <!-- Radiance Star Motif -->
    <circle cx="0" cy="-8.5" r="2.2" fill="#fef08a" />
  </g>
</svg>

